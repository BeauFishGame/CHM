<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Clearings Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/map.css">

  <style>
    /* Main controls: vertically centered */
    #top-bar {
      align-items: center;
    }

    #actions {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #main-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #main-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
    }

    /* Contextual point actions: floating popdown */
    #point-actions {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 50;

      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;

      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(0, 0, 0, 0.16);
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(6px);
    }

    #point-actions[hidden] {
      display: none !important;
    }

    #point-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 118px;
      min-height: 38px;
    }


    /* Desktop: move MapLibre navigation/geolocation controls below the top controls */
    @media (min-width: 701px) {
      .maplibregl-ctrl-top-right {
        top: 82px !important;
      }
    }

    /* Mobile */
    @media (max-width: 700px) {
   #title-container {
    display: none !important;
  }

  #top-bar {
    top: 8px !important;
    left: 2px;
    right: 2px;

    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    min-height: 0 !important;
  }
      #map-title {
        font-size: 16px;
        line-height: 1.15;
        
      }

      #map-subtitle {
        font-size: 11px;
        line-height: 1.2;

      }

      #actions {
        width: 100%;
        align-items: center;
        justify-content: center;
      }

   #main-actions {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 3px;
  }

  #main-actions button,
  #point-actions button {
    min-height: 30px;
    height: 30px;
    padding: 1px 4px;
    font-size: 10px;
    line-height: 1;
    border-radius: 7px;
  }

      #point-actions {
        top: calc(100% + 6px);
        left: 50%;
        right: auto;
        transform: translateX(-50%);

        width: min(92vw, 320px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 1px;
      }

      #point-actions button {
        width: 100%;
        min-width: 0;
        min-height: 12px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      #main-actions button,
      #point-actions button {
        font-size: 11px;
        padding-left: 3px;
        padding-right: 3px;
      }
    }
  
    /* User point editor popup */
    .point-editor-popup .maplibregl-popup-content {
      padding: 0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      min-width: 230px;
    }

    .point-editor {
      padding: 12px;
      background: rgba(255,255,255,0.98);
      color: #222;
      font-family: inherit;
    }

    .point-editor-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .point-editor-input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 9px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    .point-editor-input:focus {
      border-color: #666;
    }

    .point-editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 9px;
    }

    .point-editor-actions button {
      min-height: 34px;
      border: 0;
      border-radius: 7px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .point-editor-save {
      background: #222;
      color: #fff;
    }

    .point-editor-delete {
      background: #b42318;
      color: #fff;
    }

    .point-editor-cancel {
      background: #e8e8e8;
      color: #222;
    }

    @media (max-width: 700px) {
      .point-editor-popup .maplibregl-popup-content {
        min-width: 210px;
      }

      .point-editor {
        padding: 10px;
      }

      .point-editor-actions button {
        min-height: 32px;
        font-size: 11px;
      }
    }

</style>

</head>

<body>
  <div id="map"></div>

  <div id="top-bar"> 
  <div id="title-container"> 
    <div id="map-title" style="color:#f7449d; font-size:22px;">
      Clearings Map
    </div> 
    <div id="map-subtitle" style="color:#ffffff; font-size:14px;">
      Zoom into DOC hunting areas (green) to see mapped clearings in pink.
    </div> 
  </div>


    <div id="actions">
      <div id="main-actions">
        <button id="layer-toggle-btn" aria-pressed="true">Clearings On</button>
        <button id="doc-toggle-btn" aria-pressed="true">DOC On</button>
        <button id="basemap-toggle-btn">Satellite</button>
        <button id="terrain-toggle-btn">3D</button>
        <button id="add-point-btn" aria-pressed="false">Add Point</button>
      </div>

      <div id="point-actions" hidden>
        <button id="export-gpx-btn">Export GPX</button>
        <button id="clear-points-btn">Clear Points</button>
      </div>
    </div>

    
  </div>

  <script>
    const LINZ_API_KEY = "d01hep5551e30kxb7w85hck49tp";

    const CLEARINGS_TILE_URL = "https://data.fishandgameaccessmap.org/clearings_final/{z}/{x}/{y}";
    const CLEARINGS_SOURCE_LAYER = "chm_clearings";
    const CLEARINGS_SOURCE_ID = "clearings-source";
    const CLEARINGS_FILL_LAYER_ID = "clearings-fill";
    const CLEARINGS_LINE_LAYER_ID = "clearings-line";

    const DOC_TILE_URL = "https://data.fishandgameaccessmap.org/doc_hunting_areas/{z}/{x}/{y}";
    const DOC_SOURCE_LAYER = "doc_hunting";
    const DOC_SOURCE_ID = "doc-hunting-source";
    const DOC_FILL_LAYER_ID = "doc-fill";
    const DOC_LINE_LAYER_ID = "doc-outline";


const MISSING_LIDAR_TILE_URL = "https://data.fishandgameaccessmap.org/areas_missing_lidar/{z}/{x}/{y}";
const MISSING_LIDAR_SOURCE_LAYER = "no_lidar";
const MISSING_LIDAR_SOURCE_ID = "missing-lidar-source";
const MISSING_LIDAR_FILL_LAYER_ID = "missing-lidar-fill";

    const INITIAL_VIEW = {
      center: [173.899809, -40.714955	],
      zoom: 5,
      minZoom: 5
    };

    let currentBasemap = "Satellite";
    let clearingsVisible = true;
    let docVisible = true;
    let terrainEnabled = false;
    let addingPoints = false;
    let userPoints = [];

    const USER_POINTS_SOURCE_ID = "user-points-source";
    const USER_POINTS_LAYER_ID = "user-points-layer";

    // A GeoJSON copy of each user export is archived here.
    const EXPORT_SAVE_URL = "https://clearings-export.bjarvis-child.workers.dev";

    function getHashView() {
      const hash = window.location.hash.replace(/^#\/?/, "");
      const parts = hash.split("/");

      if (parts.length >= 3) {
        const zoom = parseFloat(parts[0]);
        const lat = parseFloat(parts[1]);
        const lng = parseFloat(parts[2]);

        if (Number.isFinite(zoom) && Number.isFinite(lat) && Number.isFinite(lng)) {
          return { zoom, lat, lng };
        }
      }

      return null;
    }

    function setTerrain(enabled) {

  terrainEnabled = enabled;

  if (enabled) {

    map.setTerrain({
      source: "LINZ-Terrain",
      exaggeration: 1.2
    });

    map.easeTo({
      pitch: 60,
      duration: 600
    });

  } else {

    map.setTerrain(null);

    map.easeTo({
      pitch: 0,
      bearing: 0,
      duration: 600
    });

  }


  document.getElementById("terrain-toggle-btn").textContent =
    enabled ? "2D" : "3D";
}
    const hashView = getHashView();
    const initialCamera = hashView
      ? { center: [hashView.lng, hashView.lat], zoom: hashView.zoom }
      : INITIAL_VIEW;

    function getClearingsSource() {
      return {
        type: "vector",
        tiles: [CLEARINGS_TILE_URL],
        minzoom: 11,
        maxzoom: 13
      };
    }

    function getDocSource() {
      return {
        type: "vector",
        tiles: [DOC_TILE_URL],
        minzoom: 0,
        maxzoom: 9
      };
    }

    
    function getNaLidarSource() {
      return {
        type: "vector",
        tiles: [MISSING_LIDAR_TILE_URL],
        minzoom: 0,
        maxzoom: 9
      };
    }

    function getUserPointsGeoJSON() {
      return {
        type: "FeatureCollection",
        features: userPoints
      };
    }

    function getUserPointsSource() {
      return {
        type: "geojson",
        data: getUserPointsGeoJSON()
      };
    }

    function getUserPointsLayer() {
      return {
        id: USER_POINTS_LAYER_ID,
        type: "circle",
        source: USER_POINTS_SOURCE_ID,
        paint: {
          "circle-radius": 5,
          "circle-color": "#FFAC1C",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1.5
        }
      };
    }

    function getDocLayers() {
      return [
        {
          id: DOC_FILL_LAYER_ID,
          type: "fill",
          source: DOC_SOURCE_ID,
          "source-layer": DOC_SOURCE_LAYER,
          paint: {
            "fill-color":[
    "match",
    ["get", "HuntStatus"],
    "Permitted", "#00aa00",     // Green
    "Restricted", "#ff9900",    // Orange
    "Prohibited", "#cc0000",    // Red
    "#888888"                   // Default (if value is missing)
  ],
            "fill-opacity": [
              "interpolate", ["linear"], ["zoom"],
              6, .4,
              13, 0.05,
              20, 0.01
            ]
          },
          layout: {
            visibility: docVisible ? "visible" : "none"
          }
        },
        {
          id: DOC_LINE_LAYER_ID,
          type: "line",
          source: DOC_SOURCE_ID,
          "source-layer": DOC_SOURCE_LAYER,
         paint: {
  "line-color": [
    "match",
    ["get", "HuntStatus"],
    "Permitted", "#00aa00",     // Green
    "Restricted", "#ff9900",    // Orange
    "Prohibited", "#cc0000",    // Red
    "#888888"                   // Default (if value is missing)
  ],
  "line-width": .7,
  "line-opacity": 1
},
          layout: {
            visibility: docVisible ? "visible" : "none"
          }
        }
      ];
    }

    function getClearingsLayers() {
      return [
        {
          id: CLEARINGS_FILL_LAYER_ID,
          type: "fill",
          source: CLEARINGS_SOURCE_ID,
          "source-layer": CLEARINGS_SOURCE_LAYER,
          minzoom: 10,
          maxzoom: 24,
          paint: {
            "fill-color": [
              "case",
              [">=", ["get", "area_m2"], 100000],
              "#0066ff",
              "#f7449d"
            ],
           "fill-opacity": [
  "interpolate", ["linear"], ["zoom"],

  6,
  [
    "case",
    [">=", ["get", "area_m2"], 100000],
    .0,
    1
  ],

  13,
  [
    "case",
    [">=", ["get", "area_m2"], 100000],
    .0,
    0.9
  ],

  20,
  [
    "case",
    [">=", ["get", "area_m2"], 100000],
    0,
    0.01
  ]
],
          },
          layout: {
            visibility: clearingsVisible ? "visible" : "none"
          }
        },
        {
          id: CLEARINGS_LINE_LAYER_ID,
          type: "line",
          source: CLEARINGS_SOURCE_ID,
          "source-layer": CLEARINGS_SOURCE_LAYER,
          minzoom: 0,
          maxzoom: 24,
          paint: {
            "line-color": [
              "case",
              [">=", ["get", "area_m2"], 100000],
              "#0066ff",
              "#f7449d"
            ],
            "line-width": [
              "interpolate", ["linear"], ["zoom"],
              8, 0.3,
              14, 1.6
            ],
            "line-opacity":[
              "case",
              [">=", ["get", "area_m2"], 100000],
              0,
              1
            ],
          },
          layout: {
            visibility: clearingsVisible ? "visible" : "none"
          }
        }
      ];
    }

    
function getNaLidarLayers() {
  return [
    {
      id: MISSING_LIDAR_FILL_LAYER_ID,
      type: "fill",
      source: MISSING_LIDAR_SOURCE_ID,
      "source-layer": MISSING_LIDAR_SOURCE_LAYER,
      paint: {
        "fill-color": "#777777",

        "fill-opacity": [
          "interpolate", ["linear"], ["zoom"],
          6, 0.5,
          13, 0.5,
          20, .5
        ]
      },
      layout: {
        visibility: clearingsVisible ? "visible" : "none"
      }
    }
  ];
}

    function getSatelliteStyle() {
      return {
        version: 8,
        glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
        sources: {
          "basemaps-aerial": {
            type: "raster",
            tiles: [
              `https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api=${LINZ_API_KEY}`
            ],
            tileSize: 256,
            attribution: "© CC BY 4.0 LINZ"
          },
          "LINZ-Terrain": {
            type: "raster-dem",
            tileSize: 256,
            maxzoom: 13,
            tiles: [
              `https://basemaps.linz.govt.nz/v1/tiles/elevation/WebMercatorQuad/{z}/{x}/{y}.png?api=${LINZ_API_KEY}&pipeline=terrain-rgb`
            ]
          },
          [DOC_SOURCE_ID]: getDocSource(),
          [CLEARINGS_SOURCE_ID]: getClearingsSource(),
          [MISSING_LIDAR_SOURCE_ID]: getNaLidarSource(),
          [USER_POINTS_SOURCE_ID]: getUserPointsSource()
        },
        layers: [
          {
            id: "basemaps-aerial",
            type: "raster",
            source: "basemaps-aerial"
          },
          ...getDocLayers(),
...getNaLidarLayers(),
...getClearingsLayers(),
          getUserPointsLayer()
        ]
      };
    }

    function getTopo50Style() {
      return {
        version: 8,
        glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
        sources: {
          "LINZ-Elevation-Hillshade": {
            type: "raster-dem",
            maxzoom: 13,
            minzoom: 0,
            tileSize: 256,
            tiles: [
              `https://basemaps.linz.govt.nz/v1/tiles/elevation/WebMercatorQuad/{z}/{x}/{y}.png?pipeline=terrain-rgb&api=${LINZ_API_KEY}`
            ]
          },
          "LINZ-Topo-Raster": {
            type: "raster",
            attribution: "© 2024 Toitū Te Whenua LINZ, CC BY 4.0",
            maxzoom: 28,
            minzoom: 0,
            tileSize: 192,
            tiles: [
              `https://basemaps.linz.govt.nz/v1/tiles/topo-raster/WebMercatorQuad/{z}/{x}/{y}.webp?api=${LINZ_API_KEY}`
            ]
          },
          "LINZ-Terrain": {
            type: "raster-dem",
            tileSize: 256,
            maxzoom: 13,
            tiles: [
              `https://basemaps.linz.govt.nz/v1/tiles/elevation/WebMercatorQuad/{z}/{x}/{y}.png?api=${LINZ_API_KEY}&pipeline=terrain-rgb`
            ]
          },
          [DOC_SOURCE_ID]: getDocSource(),
          [CLEARINGS_SOURCE_ID]: getClearingsSource(),
          [MISSING_LIDAR_SOURCE_ID]: getNaLidarSource(),
          [USER_POINTS_SOURCE_ID]: getUserPointsSource()
        },
        layers: [
          {
            id: "Topo-Raster", 
            type: "raster",
            source: "LINZ-Topo-Raster"
          },
          {
            id: "Hillshade",
            type: "hillshade",
            source: "LINZ-Elevation-Hillshade",
            paint: {
              "hillshade-exaggeration":.1  ,
              "hillshade-illumination-anchor": "map",
              "hillshade-illumination-direction": 315
            }
          },
          ...getDocLayers(),
          ...getClearingsLayers(),
...getNaLidarLayers(),
          getUserPointsLayer()
        ]
      };
    }

    const map = new maplibregl.Map({
      container: "map",
      style: getSatelliteStyle(),
      center: initialCamera.center,
      zoom: initialCamera.zoom,
      minZoom: INITIAL_VIEW.minZoom,
       pitch: 0,
  bearing: 0
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: true }));

    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }));

  

function shortcutHint(key) {
  return window.innerWidth > 700 ? ` (${key})` : "";
}

function updateTerrainButton() {
  const btn = document.getElementById("terrain-toggle-btn");
  btn.textContent = terrainEnabled ? "2D" : `3D${shortcutHint("V")}`;
  btn.setAttribute("aria-pressed", String(terrainEnabled));
}

function applyTerrainState() {
  if (!map.isStyleLoaded() || !map.getSource("LINZ-Terrain")) {
    map.once("style.load", applyTerrainState);
    return;
  }

  if (terrainEnabled) {
    map.setTerrain({
      source: "LINZ-Terrain",
      exaggeration: 1.2
    });

    map.easeTo({
      pitch: 60,
      bearing: map.getBearing(),
      duration: 500
    });
  } else {
    map.setTerrain(null);

    map.easeTo({
      pitch: 0,
      bearing: 0,
      duration: 500
    });
  }

  updateTerrainButton();
}

function toggleTerrain() {
  terrainEnabled = !terrainEnabled;
  applyTerrainState();
}


function updatePointActionButtons() {
  const actions = document.getElementById("point-actions");
  const exportBtn = document.getElementById("export-gpx-btn");
  const clearBtn = document.getElementById("clear-points-btn");
  const n = userPoints.length;

  // Export/Clear controls only appear once at least one point exists.
  actions.hidden = n === 0;

  if (n > 0) {
    exportBtn.textContent = `Export GPX (${n})`;
    clearBtn.textContent = n === 1 ? "Clear Point" : `Clear ${n} Points`;
  }
}

function updateUserPoints() {
  const source = map.getSource(USER_POINTS_SOURCE_ID);

  if (source) {
    source.setData(getUserPointsGeoJSON());
  }

  updatePointActionButtons();
}

function updateAddPointButton() {
  const btn = document.getElementById("add-point-btn");
  btn.classList.toggle("active", addingPoints);
  btn.setAttribute("aria-pressed", String(addingPoints));
  btn.textContent = addingPoints ? "Click Map" : `Add Point${shortcutHint("B")}`;
  map.getCanvas().style.cursor = addingPoints ? "crosshair" : "";
}

function toggleAddPointMode() {
  addingPoints = !addingPoints;
  updateAddPointButton();
}

function getNextClearingName() {
  const usedNumbers = userPoints
    .map(point => point.properties?.name || "")
    .map(name => {
      const match = /^Clearing\s+(\d+)$/i.exec(name.trim());
      return match ? Number(match[1]) : null;
    })
    .filter(Number.isFinite);

  const nextNumber = usedNumbers.length
    ? Math.max(...usedNumbers) + 1
    : 1;

  return `Clearing ${nextNumber}`;
}

function addUserPoint(lngLat) {
  const name = getNextClearingName();
  const pointId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;

  userPoints.push({
    type: "Feature",
    id: pointId,
    properties: {
      point_id: pointId,
      name,
      description: "",
      category: "ClearingsMapExport"
    },
    geometry: {
      type: "Point",
      coordinates: [lngLat.lng, lngLat.lat]
    }
  });

  updateUserPoints();
}

function escapeXml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&apos;");
}

function getExportGeoJSON() {
  return {
    type: "FeatureCollection",
    features: userPoints.map(feature => ({
      ...feature,
      properties: {
        ...(feature.properties || {}),
        category: "ClearingsMapExport"
      }
    }))
  };
}

function makeExportTimestamp() {
  return new Date().toISOString().replace(/[:.]/g, "-");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function saveGeoJsonExportToServer(geojson) {
  const response = await fetch(EXPORT_SAVE_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/geo+json"
    },
    body: JSON.stringify(geojson)
  });

  if (!response.ok) {
    throw new Error(`Server returned ${response.status}`);
  }

  return response.json();
}

async function archiveCurrentPoints() {
  const geojson = getExportGeoJSON();

  try {
    const result = await saveGeoJsonExportToServer(geojson);
    console.info("GeoJSON export saved:", result.filename || result);
  } catch (error) {
    console.error("Could not save GeoJSON export to server:", error);
    window.alert(
      "Your file was downloaded, but the server copy could not be saved. " +
      "Check the export endpoint or your connection."
    );
  }
}


function exportPointsAsGpx() {
  if (userPoints.length === 0) {
    window.alert("Add at least one point before exporting.");
    return;
  }

  const waypoints = userPoints.map(feature => {
    const [lng, lat] = feature.geometry.coordinates;
    const name = escapeXml(feature.properties.name);
    const description = escapeXml(feature.properties.description);

    const NZTOPO50_CATEGORY = "ClearingsMapExport";
const NZTOPO50_ICON = 21;        // binoculars
const NZTOPO50_COLORINDEX = 7; 

    return `  <wpt lat="${lat}" lon="${lng}">
    <name>${name}</name>
    <desc>${description}</desc>
  <extensions>
  <nztopo50:isclosed>false</nztopo50:isclosed>
  <nztopo50:icon>21</nztopo50:icon>
  <nztopo50:photourl></nztopo50:photourl>
  <nztopo50:category>ClearingsMapExport</nztopo50:category>
  <nztopo50:colorindex>7</nztopo50:colorindex>
</extensions>
  </wpt>`;
  }).join("\n");

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Clearings Map"
  xmlns="http://www.topografix.com/GPX/1/1"
  xmlns:nztopo50="http://www.nztopo50.sqrl.net/GPX/1/1"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
${waypoints}
</gpx>`;

  const blob = new Blob([gpx], {
    type: "application/gpx+xml;charset=utf-8"
  });

  downloadBlob(blob, `clearings-map-points-${makeExportTimestamp()}.gpx`);

  // Keep a GeoJSON archive on your server even when the user downloads GPX.
  void archiveCurrentPoints();
}

function clearUserPoints() {
  if (userPoints.length === 0) return;

  if (window.confirm("Remove all added points?")) {
    userPoints = [];
    updateUserPoints();
  }
}


 function setClearingsVisibility(visible) {
  clearingsVisible = visible;
  const visibility = visible ? "visible" : "none";

  [
    CLEARINGS_FILL_LAYER_ID,
    CLEARINGS_LINE_LAYER_ID,
    MISSING_LIDAR_FILL_LAYER_ID
  ].forEach(layerId => {
    if (map.getLayer(layerId)) {
      map.setLayoutProperty(layerId, "visibility", visibility);
    }
  });

  updateClearingsButton();
}

    function setDocVisibility(visible) {
      docVisible = visible;
      const visibility = visible ? "visible" : "none";

      [DOC_FILL_LAYER_ID, DOC_LINE_LAYER_ID].forEach(layerId => {
        if (map.getLayer(layerId)) {
          map.setLayoutProperty(layerId, "visibility", visibility);
        }
      });

      updateDocButton();
    }

    function toggleClearingsLayer() {
      setClearingsVisibility(!clearingsVisible);
    }

    function toggleDocLayer() {
      setDocVisibility(!docVisible);
    }

    function updateClearingsButton() {
      const btn = document.getElementById("layer-toggle-btn");

      btn.classList.toggle("active", clearingsVisible);
      btn.setAttribute("aria-pressed", String(clearingsVisible));
      btn.textContent = clearingsVisible ? `Clearings On${shortcutHint("Z")}` : `Clearings Off${shortcutHint("Z")}`;
    }

    function updateDocButton() {
      const btn = document.getElementById("doc-toggle-btn");

      btn.classList.toggle("active", docVisible);
      btn.setAttribute("aria-pressed", String(docVisible));
      btn.textContent = docVisible ? `DOC On${shortcutHint("X")}` : `DOC Off${shortcutHint("X")}`;
    }

function setBasemap() {
  currentBasemap = currentBasemap === "Satellite" ? "Topo" : "Satellite";

  const style = currentBasemap === "Satellite"
    ? getSatelliteStyle()
    : getTopo50Style();

  map.once("style.load", () => {
    applyTerrainState();
    updateUserPoints();
  });

  map.setStyle(style);

  document.getElementById("basemap-toggle-btn").textContent =
    currentBasemap === "Satellite" ? `Satellite${shortcutHint("C")}` : `Topo50${shortcutHint("C")}`;
}

    function updateHash() {
      const center = map.getCenter();
      const zoom = map.getZoom();

      // window.history.replaceState(
      //   null,
      //   null,
      //   `#${zoom.toFixed(2)}/${center.lat.toFixed(5)}/${center.lng.toFixed(5)}`
      // );
    }

function attachDocEvents() {
  const hoverPopup = new maplibregl.Popup({
    closeButton: false,
    closeOnClick: false,
    offset: 12
  });

  map.on("mousemove", DOC_FILL_LAYER_ID, e => {
    const feature = e.features && e.features[0];

    if (!feature) {
      hoverPopup.remove();
      return;
    }

    const props = feature.properties || {};

    const huntStatus = props.HuntStatus ?? props.huntStatus ?? props.huntstatus ?? "Unknown";
    const permitArea = props.PermitArea ?? props.permitArea ?? props.permitarea ?? "Unknown";
    const huntBlockName = props.HuntBlockName ?? props.huntBlockName ?? props.huntblockname ?? "Unknown";

    map.getCanvas().style.cursor = "pointer";

    hoverPopup
      .setLngLat(e.lngLat)
      .setHTML(`
        <div class="popup-title">${huntBlockName}</div>
        <div><strong>Status:</strong> ${huntStatus}</div>
        <div><strong>Permit area:</strong> ${permitArea}</div>
        <div><strong>Block:</strong> ${huntBlockName}</div>
      `)
      .addTo(map);
  });

  map.on("mouseleave", DOC_FILL_LAYER_ID, () => {
    map.getCanvas().style.cursor = "";
    hoverPopup.remove();
  });
}


    map.on("click", e => {
      if (!addingPoints) return;

      addUserPoint(e.lngLat);
      addingPoints = false;
      updateAddPointButton();
    });


    let pointEditorPopup = null;

    function openPointEditor(point, lngLat) {
      if (pointEditorPopup) {
        pointEditorPopup.remove();
      }

      const wrapper = document.createElement("div");
      wrapper.className = "point-editor";

      const title = document.createElement("div");
      title.className = "point-editor-title";
      title.textContent = "Edit clearing";

      const input = document.createElement("input");
      input.className = "point-editor-input";
      input.type = "text";
      input.value = point.properties?.name || "Clearing";
      input.setAttribute("aria-label", "Clearing name");

      const actions = document.createElement("div");
      actions.className = "point-editor-actions";

      const saveBtn = document.createElement("button");
      saveBtn.className = "point-editor-save";
      saveBtn.type = "button";
      saveBtn.textContent = "Save";

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "point-editor-delete";
      deleteBtn.type = "button";
      deleteBtn.textContent = "Delete";

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "point-editor-cancel";
      cancelBtn.type = "button";
      cancelBtn.textContent = "Cancel";

      actions.append(saveBtn, deleteBtn, cancelBtn);
      wrapper.append(title, input, actions);

      pointEditorPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 12,
        className: "point-editor-popup"
      })
        .setLngLat(lngLat)
        .setDOMContent(wrapper)
        .addTo(map);

      // Focus/select makes renaming quick on desktop and mobile.
      setTimeout(() => {
        input.focus();
        input.select();
      }, 0);

      const save = () => {
        const newName = input.value.trim();

        if (newName) {
          point.properties = {
            ...(point.properties || {}),
            name: newName
          };

          updateUserPoints();
        }

        pointEditorPopup?.remove();
        pointEditorPopup = null;
      };

      saveBtn.addEventListener("click", save);

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          save();
        }

        if (event.key === "Escape") {
          pointEditorPopup?.remove();
          pointEditorPopup = null;
        }
      });

      deleteBtn.addEventListener("click", () => {
        const pointId = point.properties?.point_id;

        userPoints = userPoints.filter(
          candidate => candidate.properties?.point_id !== pointId
        );

        updateUserPoints();

        pointEditorPopup?.remove();
        pointEditorPopup = null;
      });

      cancelBtn.addEventListener("click", () => {
        pointEditorPopup?.remove();
        pointEditorPopup = null;
      });

      pointEditorPopup.on("close", () => {
        pointEditorPopup = null;
      });
    }

    map.on("click", USER_POINTS_LAYER_ID, e => {
      if (addingPoints || !e.features?.length) return;

      e.originalEvent?.stopPropagation?.();

      const renderedFeature = e.features[0];
      const pointId = renderedFeature.properties?.point_id;

      const point = userPoints.find(
        candidate => candidate.properties?.point_id === pointId
      );

      if (!point) {
        console.warn("Could not find selected clearing:", renderedFeature);
        return;
      }

      openPointEditor(point, e.lngLat);
    });

    map.on("mouseenter", USER_POINTS_LAYER_ID, () => {
      if (!addingPoints) map.getCanvas().style.cursor = "pointer";
    });

    map.on("mouseleave", USER_POINTS_LAYER_ID, () => {
      map.getCanvas().style.cursor = addingPoints ? "crosshair" : "";
    });

    map.on("load", () => {
      attachClearingsEvents();
      // attachDocEvents();
      setClearingsVisibility(clearingsVisible);
      setDocVisibility(docVisible);
      terrainEnabled = false;
applyTerrainState();
    });

    document
      .getElementById("basemap-toggle-btn")
      .addEventListener("click", setBasemap);

    document
      .getElementById("layer-toggle-btn")
      .addEventListener("click", toggleClearingsLayer);

      document
  .getElementById("terrain-toggle-btn")
  .addEventListener("click", toggleTerrain);

    document
      .getElementById("doc-toggle-btn")
      .addEventListener("click", toggleDocLayer);

    document
      .getElementById("add-point-btn")
      .addEventListener("click", toggleAddPointMode);

    document
      .getElementById("export-gpx-btn")
      .addEventListener("click", exportPointsAsGpx);



    document
      .getElementById("clear-points-btn")
      .addEventListener("click", clearUserPoints);

    map.on("moveend", updateHash);

    document.addEventListener("keydown", (e) => {
  // Ignore if typing in an input, textarea, etc.
  if (
    e.target.tagName === "INPUT" ||
    e.target.tagName === "TEXTAREA" ||
    e.target.isContentEditable
  ) {
    return;
  }

  switch (e.key.toLowerCase()) {
    case "z":
      toggleClearingsLayer();
      break;

    case "x":
      toggleDocLayer();
      break;

    case "c":
      setBasemap();
      break;

    case "v":
      toggleTerrain();
      break;

    case "b":
      // Desktop shortcut for Add Point
      if (window.innerWidth > 700) {
        toggleAddPointMode();
      }
      break;
  }
});


window.addEventListener("resize", () => {
  updateClearingsButton();
  updateDocButton();
  updateTerrainButton();
  updateAddPointButton();

  document.getElementById("basemap-toggle-btn").textContent =
    currentBasemap === "Satellite"
      ? `Satellite${shortcutHint("C")}`
      : `Topo50${shortcutHint("C")}`;
});

    updateClearingsButton();
    updateDocButton();
    updateAddPointButton();
    updatePointActionButtons();
  </script>
</body>
